# Publishes the node to the Comfy Registry (registry.comfy.org).
# Manual only (Actions tab -> "Publish to Comfy Registry" -> Run workflow), so nothing is published by a push.
# Needs the repository secret REGISTRY_ACCESS_TOKEN (a publishing key from https://registry.comfy.org for
# publisher "raghav").
name: Publish to Comfy Registry
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
